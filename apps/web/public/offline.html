<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7C3AED">
  <title>Offline - Linkora</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/logo/logo-icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Linkora">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #0F172A;
      color: #F9FAFB;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .container {
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    .icon {
      font-size: 4rem;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #F9FAFB;
    }
    p {
      color: #9CA3AF;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }
    .retry-btn {
      background: #7C3AED;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    .retry-btn:hover {
      background: #6D28D9;
    }
    .retry-btn:focus {
      outline: 2px solid #F59E0B;
      outline-offset: 2px;
    }
    .spinner {
      display: inline-block;
      width: 1.25rem;
      height: 1.25rem;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 0.5rem;
      vertical-align: middle;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon" aria-hidden="true">📡</div>
    <h1>You're Offline</h1>
    <p>Linkora needs an internet connection to load. Please check your connection and try again.</p>
    <button class="retry-btn" id="retryBtn" onclick="retry()">
      <span class="spinner" id="spinner" style="display:none;"></span>
      <span id="btnText">Try Again</span>
    </button>
  </div>
  <script>
    function retry() {
      const btn = document.getElementById('retryBtn');
      const spinner = document.getElementById('spinner');
      const btnText = document.getElementById('btnText');
      
      btn.disabled = true;
      spinner.style.display = 'inline-block';
      btnText.textContent = 'Checking…';
      
      fetch('/', { method: 'HEAD', cache: 'no-cache' })
        .then(() => {
          window.location.reload();
        })
        .catch(() => {
          btn.disabled = false;
          spinner.style.display = 'none';
          btnText.textContent = 'Try Again';
        });
    }
    
    // Auto-retry when online
    window.addEventListener('online', () => {
      setTimeout(retry, 1000);
    });
    
    // Initial check
    if (navigator.onLine) {
      setTimeout(retry, 1000);
    }
  </script>
</body>
</html>
